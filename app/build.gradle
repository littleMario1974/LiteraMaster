plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.littleMario.litera'
    compileSdk 36

    defaultConfig {
        applicationId 'com.littleMario.literamaster'
        minSdk 24
        targetSdk 36
        versionCode 21
        versionName "1.3"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        viewBinding true
        compose true
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation(platform("androidx.compose:compose-bom:2024.12.01"))

    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-graphics"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.material3:material3"
    testImplementation 'junit:junit:4.12'

    debugImplementation "androidx.compose.ui:ui-tooling"
    debugImplementation "androidx.compose.ui:ui-test-manifest"

    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation "androidx.exifinterface:exifinterface:1.3.7"
    implementation "com.google.android.material:material:1.12.0"

    implementation "com.google.android.gms:play-services-ads:24.3.0"
    implementation "org.jetbrains.kotlin:kotlin-test:2.1.0"

    // OpenCV: analiza obrazu i wykrywanie czworokątnej planszy.
    implementation "org.opencv:opencv:4.12.0"

    // ML Kit: rozpoznawanie liter na pojedynczych polach planszy.
    implementation "com.google.android.gms:play-services-mlkit-text-recognition:19.0.1"
}
